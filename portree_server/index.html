<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Portree NP — Enviar E57</title>
<style>body{font:16px system-ui;background:#101b2a;color:#f1f5f9;max-width:760px;margin:8vh auto;padding:24px}main{background:#1c2c3d;padding:32px;border-radius:16px}input,button{font:inherit;margin:12px 0}button{padding:12px 20px;background:#38bdf8;border:0;border-radius:8px;cursor:pointer}a{color:#7dd3fc}small{color:#b7c6d5}</style>
<main><h1>Portree NP</h1><p>Envie um escaneamento E57 para gerar uma nuvem navegável no navegador.</p>
<input id="file" type="file" accept=".e57"><br><button id="send">Enviar e processar</button><p id="status" role="status"></p><small>Protótipo local: o processamento pode consumir muita RAM e disco. BubbleViews e medições panorâmicas ainda não estão disponíveis.</small></main>
<script>
const status=document.querySelector('#status'),button=document.querySelector('#send');
button.onclick=async()=>{const file=document.querySelector('#file').files[0];if(!file){status.textContent='Selecione um E57.';return;}button.disabled=true;
try{const form=new FormData();form.append('file',file);status.textContent='Enviando arquivo...';const res=await fetch('/api/upload',{method:'POST',body:form});const job=await res.json();if(!res.ok)throw Error(job.detail||'Erro no envio');
const timer=setInterval(async()=>{try{const response=await fetch('/api/jobs/'+job.id);const state=await response.json();status.textContent='Estado: '+state.status;if(state.status==='ready'){clearInterval(timer);status.innerHTML='Pronto! ';const link=document.createElement('a');link.href=state.url;link.textContent='Abrir nuvem 3D';status.append(link);button.disabled=false;}if(state.status==='error'){clearInterval(timer);status.textContent='Erro: '+state.error;button.disabled=false;}}catch(e){clearInterval(timer);status.textContent=e.message;button.disabled=false;}},2500);
}catch(e){status.textContent=e.message;button.disabled=false;}};
</script></html>
